<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475467"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b42318"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#127a46"/>
    </marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#101828}
      .s{font-size:12px;fill:#475467}
      .xs{font-size:11px;fill:#475467}
      .h{font-size:13px;font-weight:700;letter-spacing:.08em;fill:#344054}
      .w{font-size:12px;font-weight:700;fill:#fff}
      .box{fill:#fff;stroke:#d0d5dd;stroke-width:1.5}
      .ln{stroke:#475467;stroke-width:1.6;fill:none}
    </style>
  </defs>

  <rect width="1400" height="860" fill="#f8fafc"/>
  <text x="40" y="48" font-size="26" font-weight="800" fill="#101828">SecureShip — security-gated CI/CD for ShopPilot</text>
  <text x="40" y="74" class="s" font-size="14">Nothing reaches the server unless the policy gate passes · nothing stays on the server unless it proves it is healthy · every run leaves signed evidence</text>

  <!-- Developer + GitHub -->
  <rect x="40" y="120" width="190" height="96" rx="12" class="box"/>
  <text x="58" y="148" class="t">Developer</text>
  <text x="58" y="170" class="s">git push to ShopPilot</text>
  <text x="58" y="188" class="s">(FastAPI + React)</text>

  <rect x="40" y="250" width="190" height="120" rx="12" class="box"/>
  <text x="58" y="278" class="t">GitHub</text>
  <text x="58" y="300" class="s">ShopPilot repo (app)</text>
  <text x="58" y="318" class="s">SecureShip repo</text>
  <text x="58" y="336" class="s">(Jenkinsfile, policy,</text>
  <text x="58" y="354" class="s">scripts — all as code)</text>
  <path d="M135 216 V246" class="ln" marker-end="url(#a)"/>
  <path d="M230 310 H276" class="ln" marker-end="url(#a)"/>
  <text x="240" y="300" class="xs">poll</text>

  <!-- Jenkins frame -->
  <rect x="280" y="104" width="1080" height="380" rx="16" fill="#eef4ff" stroke="#b2ccff" stroke-width="1.5"/>
  <text x="300" y="132" class="h">JENKINS (CONFIGURED AS CODE) · LOCAL DOCKER LAB</text>

  <!-- stage pills row 1 -->
  <g>
    <rect x="300" y="152" width="150" height="62" rx="10" fill="#fff" stroke="#84adff"/>
    <text x="314" y="176" class="t" font-size="13">1 · Checkout</text>
    <text x="314" y="196" class="xs">provenance → build.json</text>

    <rect x="470" y="152" width="150" height="62" rx="10" fill="#fff" stroke="#84adff"/>
    <text x="484" y="176" class="t" font-size="13">2 · Secret scan</text>
    <text x="484" y="196" class="xs">Gitleaks · full history</text>

    <rect x="640" y="152" width="150" height="62" rx="10" fill="#fff" stroke="#84adff"/>
    <text x="654" y="176" class="t" font-size="13">3 · Build images</text>
    <text x="654" y="196" class="xs">tag = build-commit</text>

    <rect x="810" y="152" width="160" height="62" rx="10" fill="#fff" stroke="#84adff"/>
    <text x="824" y="176" class="t" font-size="13">4 · Tests in image</text>
    <text x="824" y="196" class="xs">pytest + temp Postgres</text>

    <rect x="990" y="152" width="150" height="62" rx="10" fill="#fff" stroke="#84adff"/>
    <text x="1004" y="176" class="t" font-size="13">5 · SonarQube</text>
    <text x="1004" y="196" class="xs">quality gate</text>

    <rect x="1160" y="152" width="180" height="62" rx="10" fill="#fff" stroke="#84adff"/>
    <text x="1174" y="176" class="t" font-size="13">6 · Trivy + SBOM</text>
    <text x="1174" y="196" class="xs">images · Dockerfiles</text>
  </g>
  <path d="M450 183 H466" class="ln" marker-end="url(#a)"/>
  <path d="M620 183 H636" class="ln" marker-end="url(#a)"/>
  <path d="M790 183 H806" class="ln" marker-end="url(#a)"/>
  <path d="M970 183 H986" class="ln" marker-end="url(#a)"/>
  <path d="M1140 183 H1156" class="ln" marker-end="url(#a)"/>

  <!-- gate -->
  <path d="M1250 214 V244 H820 V262" class="ln" marker-end="url(#a)"/>
  <rect x="560" y="266" width="520" height="108" rx="14" fill="#101828"/>
  <text x="584" y="296" font-size="17" font-weight="800" fill="#fff">7 · POLICY GATE  (security/policy.yaml)</text>
  <text x="584" y="320" font-size="12" fill="#d0d5dd">tests · coverage · Sonar · secrets · CRITICAL/HIGH CVEs · Dockerfile · non-root</text>
  <text x="584" y="340" font-size="12" fill="#d0d5dd">risk acceptances need owner + reason + expiry (≤ 90 days) · missing evidence = FAIL</text>
  <text x="584" y="360" font-size="12" fill="#d0d5dd">→ gate.json · residual risk score 0–100</text>

  <!-- blocked -->
  <rect x="300" y="282" width="210" height="76" rx="12" fill="#fdecea" stroke="#f04438"/>
  <text x="318" y="310" class="t" fill="#b42318">FAIL → blocked</text>
  <text x="318" y="330" class="xs">build fails, nothing deployed,</text>
  <text x="318" y="346" class="xs">reasons listed in evidence</text>
  <path d="M560 320 H514" stroke="#b42318" stroke-width="1.8" fill="none" marker-end="url(#ar)"/>

  <!-- deploy -->
  <rect x="1120" y="266" width="220" height="108" rx="12" fill="#e5f5ec" stroke="#32d583"/>
  <text x="1138" y="294" class="t" fill="#127a46">8 · Deploy over SSH</text>
  <text x="1138" y="316" class="xs">docker save | ssh | docker load</text>
  <text x="1138" y="334" class="xs">no registry · key-only SSH</text>
  <text x="1138" y="352" class="xs">optional chaos mode (demo)</text>
  <path d="M1080 320 H1116" stroke="#127a46" stroke-width="1.8" fill="none" marker-end="url(#ag)"/>
  <text x="1086" y="312" font-size="11" font-weight="700" fill="#127a46">PASS</text>

  <!-- tools row -->
  <rect x="300" y="398" width="880" height="66" rx="10" fill="#fff" stroke="#d0d5dd" stroke-dasharray="5 4"/>
  <text x="318" y="422" class="t" font-size="13">10 · Evidence &amp; ledger (post: always)</text>
  <text x="318" y="443" class="xs">evidence.json + evidence.html per build · evidence SHA-256 in a hash-chained, HMAC-signed ledger, each entry</text><text x="318" y="458" class="xs">anchored in an append-only file on the server (+ optional Git) → edits AND deleted newest entries are detected</text>

  <!-- target -->
  <rect x="640" y="530" width="720" height="290" rx="16" fill="#ecfdf3" stroke="#6ce9a6" stroke-width="1.5"/>
  <text x="660" y="558" class="h">DEPLOYMENT TARGET · lab-target (DinD + SSH) or Ubuntu VM / AWS EC2</text>
  <path d="M1230 374 V526" stroke="#127a46" stroke-width="1.8" fill="none" marker-end="url(#ag)"/>

  <rect x="660" y="578" width="200" height="80" rx="10" fill="#fff" stroke="#a6f4c5"/>
  <text x="676" y="604" class="t" font-size="13">NGINX (frontend)</text>
  <text x="676" y="624" class="xs">React build · :8080 only</text>
  <text x="676" y="642" class="xs">security headers · /api proxy</text>

  <rect x="890" y="578" width="200" height="80" rx="10" fill="#fff" stroke="#a6f4c5"/>
  <text x="906" y="604" class="t" font-size="13">FastAPI (backend)</text>
  <text x="906" y="624" class="xs">uid 10001 · caps dropped</text>
  <text x="906" y="642" class="xs">GET /health (db + version)</text>

  <rect x="1120" y="578" width="210" height="80" rx="10" fill="#fff" stroke="#a6f4c5"/>
  <text x="1136" y="604" class="t" font-size="13">PostgreSQL</text>
  <text x="1136" y="624" class="xs">internal network only</text>
  <text x="1136" y="642" class="xs">backup before every release</text>
  <path d="M860 618 H886" class="ln" marker-end="url(#a)"/>
  <path d="M1090 618 H1116" class="ln" marker-end="url(#a)"/>

  <rect x="660" y="680" width="670" height="122" rx="10" fill="#fff" stroke="#a6f4c5"/>
  <text x="676" y="706" class="t" font-size="13">9 · Self-healing release controller (scripts/remote/release.sh)</text>
  <text x="676" y="728" class="xs">record current version → pg_dump backup (abort if it fails) → start new version → health check via NGINX</text>
  <text x="676" y="746" class="xs">must answer 200 + {"status":"ok"} AND report the NEW version tag → else collect logs and AUTO-ROLLBACK to previous</text>
  <text x="676" y="764" class="xs">release, re-verify it, report ROLLED_BACK · state files + history.log · keeps current + previous images</text>
  <text x="676" y="786" class="xs" font-weight="700" fill="#127a46">then: OWASP ZAP baseline (DAST) scans the live app · ledger anchors kept in append-only /opt/secureship/anchors</text>

  <!-- side services -->
  <rect x="40" y="530" width="560" height="290" rx="16" fill="#fff" stroke="#d0d5dd"/>
  <text x="60" y="558" class="h">FREE TOOLING (ALL IN DOCKER)</text>
  <g font-size="12" fill="#344054">
    <text x="60" y="590" font-weight="700">Jenkins LTS</text><text x="210" y="590">pipeline, credentials store, JCasC</text>
    <text x="60" y="616" font-weight="700">SonarQube CE</text><text x="210" y="616">static analysis + quality gate</text>
    <text x="60" y="642" font-weight="700">Trivy</text><text x="210" y="642">CVEs, SBOM, Dockerfile IaC · built from source (Go sumdb)</text>
    <text x="60" y="668" font-weight="700">Gitleaks</text><text x="210" y="668">secrets in the whole Git history</text>
    <text x="60" y="694" font-weight="700">OWASP ZAP</text><text x="210" y="694">passive DAST of the deployed app</text>
    <text x="60" y="720" font-weight="700">Docker Compose</text><text x="210" y="720">runtime on the target</text>
    <text x="60" y="746" font-weight="700">Cloudflare Tunnel</text><text x="210" y="746">optional public demo URL, no open port</text>
    <text x="60" y="772" font-weight="700">AWS EC2</text><text x="210" y="772">optional target (same scripts, SG-restricted)</text>
  </g>
  <text x="60" y="804" class="xs">Secrets: Jenkins Credentials + server-side .env (chmod 600) — never in Git or images</text>
</svg>
