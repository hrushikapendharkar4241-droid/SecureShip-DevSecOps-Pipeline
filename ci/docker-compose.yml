# SecureShip local DevSecOps lab – 100% free, runs on your laptop with Docker Desktop.
#
#   jenkins     http://localhost:8080   CI/CD orchestrator (Trivy, Gitleaks, Docker CLI baked in)
#   sonarqube   http://localhost:9000   static analysis + quality gate (Community Build)
#   lab-target  http://localhost:8088   Linux "server" (Docker-in-Docker + SSH) that ShopPilot is deployed to
#
# Start everything with:  ./ci/bootstrap.sh     (generates secrets, SSH keys and the Sonar token)

name: secureship-ci

services:
  jenkins:
    build: ./jenkins
    image: secureship/jenkins:local
    container_name: secureship-jenkins
    restart: unless-stopped
    env_file: .env
    environment:
      JENKINS_CONTAINER: secureship-jenkins
      CI_NETWORK: secureship-ci
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_PUBLIC_URL: http://localhost:9000
      DEPLOY_HOST: lab-target
      DEPLOY_USER: deploy
      DEPLOY_PORT: "22"
      DEPLOY_DIR: /opt/secureship
      APP_PUBLIC_URL: http://lab-target:8080
      TRIVY_CACHE_DIR: /var/jenkins_home/.cache/trivy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./keys/deploy_ed25519:/run/secrets/deploy_key:ro
    depends_on: [sonarqube, lab-target]

  sonarqube:
    image: sonarqube:community
    container_name: secureship-sonarqube
    restart: unless-stopped
    depends_on: [sonar-db]
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?run ci/bootstrap.sh first}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"   # lab only: skips vm.max_map_count check on Docker Desktop
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  sonar-db:
    image: postgres:16-alpine
    container_name: secureship-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?run ci/bootstrap.sh first}
      POSTGRES_DB: sonar
    volumes:
      - sonar_db:/var/lib/postgresql/data

  lab-target:
    build: ./lab-target
    image: secureship/lab-target:local
    container_name: secureship-lab-target
    hostname: lab-target
    restart: unless-stopped
    privileged: true            # required for Docker-in-Docker (lab only – a real server uses a normal Docker install)
    environment:
      DOCKER_TLS_CERTDIR: ""
    ports:
      - "127.0.0.1:8088:8080"   # ShopPilot as deployed on the target -> http://localhost:8088
      - "127.0.0.1:2222:22"     # optional: ssh -p 2222 -i ci/keys/deploy_ed25519 deploy@localhost
    volumes:
      - lab_target_docker:/var/lib/docker
      - lab_target_app:/opt/secureship
      - ./keys/deploy_ed25519.pub:/run/secrets/authorized_keys:ro

networks:
  default:
    name: secureship-ci

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db:
  lab_target_docker:
  lab_target_app:
